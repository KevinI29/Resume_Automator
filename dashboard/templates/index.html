<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Auto</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap');

:root {
    --bg-primary:   #0f1117;
    --bg-card:      #1a1d27;
    --bg-sidebar:   #0d0f1a;
    --border:       #1e2130;
    --border-hover: #2a2d3e;
    --accent:       #6366f1;
    --success:      #22c55e;
    --warning:      #eab308;
    --danger:       #ef4444;
    --info:         #3b82f6;
    --orange:       #f97316;
    --text-primary: #f1f5f9;
    --text-muted:   #64748b;
    --text-dim:     #374151;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    height: 100%;
    overflow: hidden;
}

body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

a { color: inherit; text-decoration: none; }
button, input, select { font-family: inherit; }

/* ── Top bar ─────────────────────────────────────────────────────── */
#top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 64px;
    background: var(--bg-primary);
    border-bottom: 1px solid var(--border);
    z-index: 100;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
}

#logo {
    font-family: 'IBM Plex Mono', 'Courier New', Courier, monospace;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
}

.top-bar-left {
    display: flex;
    align-items: center;
    gap: 14px;
    overflow-x: auto;
    min-width: 0;
}

#stat-pills {
    display: flex;
    gap: 8px;
    flex-wrap: nowrap;
}

.stat-pill {
    font-family: 'IBM Plex Mono', 'Courier New', Courier, monospace;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.1s ease;
    border: none;
}
.stat-pill:hover { opacity: 0.8; }
.stat-pill--neutral { background: var(--border); color: #fff; }
.stat-pill--accent  { background: var(--accent);  color: #fff; }
.stat-pill--success { background: var(--success); color: #fff; }
.stat-pill--info    { background: var(--info);    color: #fff; }
.stat-pill--danger  { background: var(--danger);  color: #fff; }

.top-bar-center {
    display: flex;
    justify-content: center;
}

#search-wrapper {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 380px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
}
#search-wrapper:focus-within { border-color: var(--accent); }

.search-icon { font-size: 13px; opacity: 0.6; }

#search-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 13px;
    min-width: 0;
}
#search-input::placeholder { color: var(--text-muted); }

#search-clear {
    display: none;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
}
#search-clear:hover { color: var(--text-primary); }

.top-bar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: flex-end;
}

#btn-run-pipeline {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: background 0.12s ease;
}
#btn-run-pipeline:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 14%, transparent); }
#btn-run-pipeline:disabled { opacity: 0.6; cursor: not-allowed; }

#btn-apply-all {
    background: var(--success);
    border: none;
    color: #fff;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.12s ease;
}
#btn-apply-all:hover:not(:disabled) { opacity: 0.88; }
#btn-apply-all:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

/* ── Sidebar ─────────────────────────────────────────────────────── */
#sidebar {
    position: fixed;
    top: 64px; left: 0; bottom: 0;
    width: 220px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 16px 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0;
}

.sidebar-label {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 16px 0 6px 0;
    padding-left: 4px;
}
.sidebar-label:first-child { margin-top: 0; }

.filter-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 4px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-muted);
    border-left: 3px solid transparent;
    transition: all 0.1s ease;
}
.filter-row:hover:not(.active) { color: var(--text-primary); background: rgba(255,255,255,0.03); }
.filter-row.active {
    border-left: 3px solid var(--accent);
    background: rgba(99, 102, 241, 0.08);
    padding-left: 1px;
    color: var(--text-primary);
}
.filter-count {
    font-family: 'IBM Plex Mono', 'Courier New', Courier, monospace;
    font-size: 11px;
    color: var(--text-muted);
}

#sort-select {
    width: 100%;
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 8px;
    font-size: 12px;
    cursor: pointer;
    outline: none;
    margin-bottom: 12px;
}
#sort-select:focus { border-color: var(--accent); }

.toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 5px 4px;
}
.toggle-row:hover { color: var(--text-primary); }
.toggle-row input[type="checkbox"] { accent-color: var(--accent); }

.maint-btn {
    width: 100%;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    text-align: left;
    padding: 6px 4px;
    cursor: pointer;
    border-radius: 4px;
}
.maint-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.03); }
.maint-btn--danger:hover { color: var(--danger); }
.maint-btn:disabled { opacity: 0.6; cursor: not-allowed; }

.nav-section {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.nav-link {
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    padding: 6px 4px;
    border-radius: 4px;
}
.nav-link:hover { color: var(--text-primary); }
.nav-link--active { color: var(--accent); font-weight: 500; }

/* ── Job grid ────────────────────────────────────────────────────── */
#grid-area {
    margin-left: 220px;
    margin-top: 64px;
    padding: 20px;
    overflow-y: auto;
    height: calc(100vh - 64px);
    box-sizing: border-box;
}

#grid-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--text-muted);
}

#job-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
    max-width: 1400px;
}

/* ── Job card ────────────────────────────────────────────────────── */
.job-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.job-card:hover {
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    transform: translateY(-2px);
    border-color: var(--border-hover);
}
.job-card--closed { opacity: 0.45; }
.job-card--manual { background: color-mix(in srgb, var(--bg-card) 88%, black); }

.card-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
}

.score-badge {
    font-family: 'IBM Plex Mono', 'Courier New', Courier, monospace;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    flex-shrink: 0;
    margin-top: 1px;
}

.card-title-block { flex: 1; min-width: 0; }

.card-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-company {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
}

.expiry-icon {
    font-size: 15px;
    color: var(--orange);
    flex-shrink: 0;
    cursor: help;
}

.aging-icon {
    font-size: 14px;
    color: var(--text-muted);
    flex-shrink: 0;
    cursor: help;
}

.card-badges { display: flex; gap: 6px; flex-wrap: wrap; }

.badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: inline-block;
}
.badge--easy   { background: color-mix(in srgb, var(--success) 20%, transparent); color: var(--success); }
.badge--manual { background: color-mix(in srgb, var(--warning) 20%, transparent); color: var(--warning); }
.badge--expired {
    background: color-mix(in srgb, var(--orange) 15%, transparent);
    color: var(--orange);
    border: 1px solid color-mix(in srgb, var(--orange) 40%, transparent);
    text-transform: none;
}

.fit-reason {
    font-size: 12px;
    color: var(--text-muted);
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    line-height: 1.5;
}

.card-meta-time {
    font-size: 10px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', 'Courier New', Courier, monospace;
}

.card-divider { height: 1px; background: var(--border); margin: 2px 0; }

.card-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* ── Buttons ─────────────────────────────────────────────────────── */
.btn {
    border: none;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 500;
    padding: 6px 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    transition: opacity 0.12s ease;
}
.btn:hover:not(:disabled) { opacity: 0.85; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-approve  { background: color-mix(in srgb, var(--success) 22%, transparent); color: var(--success); }
.btn-skip     { background: color-mix(in srgb, var(--danger) 22%, transparent);  color: var(--danger); }
.btn-validate { background: color-mix(in srgb, var(--info) 22%, transparent);    color: var(--info); }
.btn-view     { background: color-mix(in srgb, var(--text-muted) 15%, transparent); color: var(--text-muted); }
.btn-view:hover:not(:disabled) { color: var(--text-primary); }
.btn-download { background: color-mix(in srgb, var(--info) 22%, transparent);    color: var(--info); }
.btn-tailoring{ background: color-mix(in srgb, var(--accent) 20%, transparent);  color: var(--accent); cursor: default; }
.btn-restore  { background: color-mix(in srgb, var(--text-muted) 15%, transparent); color: var(--text-primary); }
.btn-manual   { background: color-mix(in srgb, var(--warning) 20%, transparent); color: var(--warning); }
.btn-info     { background: color-mix(in srgb, var(--info) 22%, transparent);    color: var(--info); }

.status-text {
    font-size: 11px;
    font-weight: 500;
    padding: 6px 2px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.status-text--success { color: var(--success); }
.status-text--danger   { color: var(--danger); }
.status-text--muted    { color: var(--text-muted); }

.spin-icon {
    display: inline-block;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Empty state ─────────────────────────────────────────────────── */
.empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-title { font-size: 18px; color: var(--text-primary); margin-bottom: 8px; }
.empty-message { font-size: 14px; }

/* ── Detail panel ────────────────────────────────────────────────── */
#detail-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
}
#detail-backdrop.open {
    opacity: 1;
    pointer-events: all;
}

#detail-panel {
    position: fixed;
    top: 64px; right: 0; bottom: 0;
    width: 480px;
    background: var(--bg-card);
    border-left: 1px solid var(--border);
    z-index: 201;
    transform: translateX(100%);
    transition: transform 0.2s ease;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
#detail-panel.open {
    transform: translateX(0);
}

.detail-panel-header {
    padding: 12px 16px 0;
    display: flex;
    justify-content: flex-end;
    flex-shrink: 0;
}
.detail-close-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
}
.detail-close-btn:hover { color: var(--text-primary); }

#detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 4px 22px 22px;
}

.detail-header-row {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 4px;
}
.detail-title-block { flex: 1; min-width: 0; }
.detail-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
.detail-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
.detail-badges { display: flex; gap: 6px; flex-wrap: wrap; }

.section-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 18px 0 8px;
}
.detail-text {
    font-size: 13px;
    line-height: 1.65;
    color: var(--text-primary);
    white-space: pre-wrap;
}

/* ── Answer panel (pending questions) ───────────────────────────────── */
.form-label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
}
.form-input {
    width: 100%;
    background: var(--bg-primary);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.15s ease;
}
.form-input:focus { border-color: var(--accent); }

.ai-suggestion-label {
    display: block;
    font-size: 11px;
    color: var(--info);
    margin-bottom: 6px;
}

.btn-primary {
    background: var(--accent);
    border: none;
    color: #fff;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    width: 100%;
}
.btn-primary:hover { opacity: 0.9; }

/* ── QA bank modal ───────────────────────────────────────────────── */
#qabank-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
}
#qabank-backdrop.open { display: flex; }

#qabank-modal {
    width: min(720px, 92vw);
    max-height: 80vh;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
#qabank-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}
#qabank-modal-header .detail-title { font-size: 15px; }
#qabank-modal-body {
    overflow-y: auto;
    padding: 8px 20px 20px;
}

.qabank-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.qabank-table th {
    text-align: left;
    color: var(--text-muted);
    font-weight: 500;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 8px 6px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg-card);
}
.qabank-table td {
    padding: 8px 6px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    color: var(--text-primary);
}
.qabank-answer-cell { cursor: text; }
.qabank-answer-cell input {
    width: 100%;
    background: var(--bg-primary);
    color: var(--text-primary);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 12px;
}
.qabank-source-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
    text-transform: uppercase;
}
.qabank-source-badge--config { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
.qabank-source-badge--ai     { background: color-mix(in srgb, var(--orange) 20%, transparent); color: var(--orange); }
.qabank-source-badge--manual { background: color-mix(in srgb, var(--success) 20%, transparent); color: var(--success); }
.qabank-delete-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
}
.qabank-delete-btn:hover { color: var(--danger); }

/* ── Toasts ──────────────────────────────────────────────────────── */
#toast-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 500;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.toast {
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 13px;
    color: #fff;
    min-width: 280px;
    max-width: 400px;
    animation: slideIn 0.2s ease;
}
.toast--success { background: #14532d; border: 1px solid var(--success); }
.toast--error   { background: #450a0a; border: 1px solid var(--danger); }
.toast--info    { background: #1e1b4b; border: 1px solid var(--accent); }

@keyframes slideIn {
    from { transform: translateX(40px); opacity: 0; }
    to   { transform: translateX(0);   opacity: 1; }
}
</style>
</head>
<body>

<!-- ── Top bar ──────────────────────────────────────────────────────── -->
<div id="top-bar">
  <div class="top-bar-left">
    <div id="logo">Job Auto</div>
    <div id="stat-pills"></div>
  </div>

  <div class="top-bar-center">
    <div id="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search by title, company, or keyword..." autocomplete="off">
      <button id="search-clear" onclick="clearSearch()">×</button>
    </div>
  </div>

  <div class="top-bar-right">
    <button id="btn-run-pipeline" onclick="runPipelineClick()">▷ Run Pipeline</button>
    <button id="btn-apply-all" onclick="applyAllClick()" disabled>✓ Apply All (0)</button>
  </div>
</div>

<!-- ── Sidebar ──────────────────────────────────────────────────────── -->
<aside id="sidebar">
  <div class="sidebar-label">Filter</div>
  <div class="filter-row active" data-status="" onclick="setFilter('')">
    <span class="filter-name">All Jobs</span><span class="filter-count">—</span>
  </div>
  <div class="filter-row" data-status="new" onclick="setFilter('new')">
    <span class="filter-name">New</span><span class="filter-count">—</span>
  </div>
  <div class="filter-row" data-status="approved" onclick="setFilter('approved')">
    <span class="filter-name">Approved</span><span class="filter-count">—</span>
  </div>
  <div class="filter-row" data-status="pending_questions" onclick="setFilter('pending_questions')">
    <span class="filter-name">⏳ Needs Answers</span><span class="filter-count" id="count-pending-questions">0</span>
  </div>
  <div class="filter-row" data-status="applied" onclick="setFilter('applied')">
    <span class="filter-name">Applied</span><span class="filter-count">—</span>
  </div>
  <div class="filter-row" data-status="manual" onclick="setFilter('manual')">
    <span class="filter-name">Manual</span><span class="filter-count">—</span>
  </div>
  <div class="filter-row" data-status="skipped" onclick="setFilter('skipped')">
    <span class="filter-name">Skipped</span><span class="filter-count">—</span>
  </div>
  <div class="filter-row" data-status="closed" onclick="setFilter('closed')">
    <span class="filter-name">Closed</span><span class="filter-count">—</span>
  </div>

  <div class="sidebar-label">Sort By</div>
  <select id="sort-select" onchange="setSort(this.value)">
    <option value="score_desc">Score (High → Low)</option>
    <option value="score_asc">Score (Low → High)</option>
    <option value="date_desc">Date (Newest First)</option>
    <option value="date_asc">Date (Oldest First)</option>
    <option value="company_asc">Company (A → Z)</option>
  </select>

  <label class="toggle-row">
    <input type="checkbox" id="toggle-easy-apply" onchange="setEasyApplyFilter(this.checked)">
    <span>Easy Apply only</span>
  </label>
  <label class="toggle-row">
    <input type="checkbox" id="toggle-hide-expired" onchange="setHideExpired(this.checked)">
    <span>Hide expired</span>
  </label>

  <div class="sidebar-label">Maintenance</div>
  <button class="maint-btn" id="btn-validate" onclick="triggerValidation()">Validate Jobs</button>
  <button class="maint-btn maint-btn--danger" id="btn-purge" onclick="triggerPurge()">
    Purge Expired (<span id="purge-count">0</span>)
  </button>
  <button class="maint-btn maint-btn--danger" id="btn-purge-old" data-max-age="{{ config.MAX_JOB_AGE_DAYS }}" onclick="triggerPurgeOld()">
    Purge Old Jobs (<span id="purge-old-count">0</span>)
  </button>
  <button class="maint-btn" id="btn-restore" onclick="triggerRestoreAll()">
    Restore Skipped (<span id="restore-count">0</span>)
  </button>
  <button class="maint-btn" onclick="openQABankModal()">
    🗂 Manage Saved Answers
  </button>

  <div class="nav-section">
    <a class="nav-link nav-link--active" href="/">📋 Jobs</a>
    <a class="nav-link" href="/resume">📝 Resume</a>
    <a class="nav-link" href="/searches">🔍 Searches</a>
  </div>
</aside>

<!-- ── Job grid ─────────────────────────────────────────────────────── -->
<main id="grid-area">
  <div id="grid-header">
    <span id="grid-header-text">Showing 0 jobs</span>
  </div>
  <div id="job-grid">
    <div class="empty-state">
      <div class="empty-icon">⏳</div>
      <div class="empty-title">Loading…</div>
    </div>
  </div>
</main>

<!-- ── Detail panel ─────────────────────────────────────────────────── -->
<div id="detail-backdrop"></div>
<div id="detail-panel">
  <div class="detail-panel-header">
    <button class="detail-close-btn" onclick="closeDetail()">×</button>
  </div>
  <div id="detail-body"></div>
</div>


<!-- ── QA bank modal ────────────────────────────────────────────────── -->
<div id="qabank-backdrop" onclick="if(event.target===this) closeQABankModal()">
  <div id="qabank-modal">
    <div id="qabank-modal-header">
      <div class="detail-title">🗂 Manage Saved Answers</div>
      <button class="detail-close-btn" onclick="closeQABankModal()">×</button>
    </div>
    <div id="qabank-modal-body">Loading…</div>
  </div>
</div>

<!-- ── Toasts ───────────────────────────────────────────────────────── -->
<div id="toast-container"></div>

<script>
/* ── State ───────────────────────────────────────────────────────── */
const state = {
    status:        '',
    sort:          'score_desc',
    search:        '',
    easyApplyOnly: false,
    hideExpired:   false,
    selectedJobId: null,
};

let allJobs = [];
const pollingResumeJobs = new Set();
const validatingJobs = new Set();

/* ── API helper ──────────────────────────────────────────────────── */
async function api(url, options = {}) {
    const response = await fetch(url, options);
    if (!response.ok) {
        const err = await response.json().catch(() => ({ detail: response.statusText }));
        throw new Error(err.detail || `HTTP ${response.status}`);
    }
    return response.json();
}

/* ── Helpers ─────────────────────────────────────────────────────── */
function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function timeAgo(dateStr) {
    if (!dateStr) return '';
    const date = new Date(dateStr.replace(' ', 'T'));
    const secs = Math.floor((Date.now() - date.getTime()) / 1000);
    if (secs < 60) return 'Just now';
    if (secs < 3600) return `${Math.floor(secs / 60)}m ago`;
    if (secs < 86400) return `${Math.floor(secs / 3600)}h ago`;
    if (secs < 604800) return `${Math.floor(secs / 86400)}d ago`;
    return `${Math.floor(secs / 604800)}w ago`;
}

function scoreBadgeColor(score) {
    if (score >= 9) return { bg: 'var(--success)', color: '#fff' };
    if (score >= 7) return { bg: 'var(--accent)',  color: '#fff' };
    if (score >= 6) return { bg: 'var(--warning)', color: '#111' };
    if (score >= 4) return { bg: 'var(--orange)',  color: '#fff' };
    return               { bg: 'var(--danger)',  color: '#fff' };
}

function showToast(message, type = 'info', duration) {
    if (duration == null) duration = type === 'error' ? 5000 : 3000;
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast toast--${type}`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
    }, duration);
}

/* ── Fetch: jobs + stats ─────────────────────────────────────────── */
async function fetchJobs() {
    const params = new URLSearchParams();
    if (state.status)        params.set('status', state.status);
    if (state.sort)          params.set('sort', state.sort);
    if (state.search)        params.set('search', state.search);
    if (state.easyApplyOnly) params.set('easy_apply', 'true');

    try {
        const jobs = await api('/api/jobs?' + params.toString());
        allJobs = jobs;

        const rendered = state.hideExpired
            ? jobs.filter(j => !j.is_likely_expired)
            : jobs;

        renderGrid(rendered);
        updateApplyAllCount();
        startTailoringPollers();
    } catch (e) {
        showToast('Failed to load jobs: ' + e.message, 'error');
    }
}

async function fetchStats() {
    try {
        const stats = await api('/api/stats');
        renderStats(stats);
        renderSidebarCounts(stats);
        renderMaintenanceCounts(stats);
    } catch (e) {
        console.error('Stats fetch failed:', e);
    }
}

/* ── Top bar rendering ───────────────────────────────────────────── */
function renderStats(stats) {
    const pills = [
        { label: 'Total',    value: stats.total,    status: '',         cls: 'neutral' },
        { label: 'New',      value: stats.new,      status: 'new',      cls: 'accent' },
        { label: 'Approved', value: stats.approved, status: 'approved', cls: 'success' },
        { label: 'Applied',  value: stats.applied,  status: 'applied',  cls: 'info' },
    ];
    let html = pills.map(p =>
        `<span class="stat-pill stat-pill--${p.cls}" onclick="setFilter('${p.status}')">${p.label}: ${p.value}</span>`
    ).join('');

    if (stats.likely_expired > 0) {
        html += `<span class="stat-pill stat-pill--danger" onclick="setFilter('new')">⚠ Likely Expired: ${stats.likely_expired}</span>`;
    }

    document.getElementById('stat-pills').innerHTML = html;
}

function renderSidebarCounts(stats) {
    const map = {
        '':                  stats.total,
        'new':               stats.new,
        'approved':          stats.approved,
        'pending_questions': stats.pending_questions,
        'applied':           stats.applied,
        'manual':            stats.manual,
        'skipped':           stats.skipped,
        'closed':            stats.closed,
    };
    document.querySelectorAll('.filter-row').forEach(row => {
        const status = row.dataset.status;
        const countEl = row.querySelector('.filter-count');
        if (countEl && status in map) countEl.textContent = map[status];
    });
}

function renderMaintenanceCounts(stats) {
    const purgeCount = (stats.closed || 0) + (stats.failed || 0);
    const restoreCount = stats.skipped || 0;
    const purgeOldCount = stats.purgeable_old || 0;
    document.getElementById('purge-count').textContent = purgeCount;
    document.getElementById('restore-count').textContent = restoreCount;
    document.getElementById('purge-old-count').textContent = purgeOldCount;
    document.getElementById('btn-purge').style.display = purgeCount === 0 ? 'none' : 'block';
    document.getElementById('btn-restore').style.display = restoreCount === 0 ? 'none' : 'block';
    document.getElementById('btn-purge-old').style.display = purgeOldCount === 0 ? 'none' : 'block';
}

/* ── Filters, sort, search, toggles ──────────────────────────────── */
function setFilter(status) {
    state.status = status;
    document.querySelectorAll('.filter-row').forEach(row => {
        row.classList.toggle('active', row.dataset.status === status);
    });
    fetchJobs();
}

function setSort(value) {
    state.sort = value;
    fetchJobs();
}

function setEasyApplyFilter(checked) {
    state.easyApplyOnly = checked;
    fetchJobs();
}

function setHideExpired(checked) {
    state.hideExpired = checked;
    const rendered = checked ? allJobs.filter(j => !j.is_likely_expired) : allJobs;
    renderGrid(rendered);
}

const searchInputEl = document.getElementById('search-input');
const searchClearEl = document.getElementById('search-clear');
let searchDebounceTimer = null;

searchInputEl.addEventListener('input', (e) => {
    searchClearEl.style.display = e.target.value.length ? 'flex' : 'none';
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => {
        state.search = e.target.value.trim();
        fetchJobs();
    }, 300);
});

function clearSearch() {
    searchInputEl.value = '';
    searchClearEl.style.display = 'none';
    state.search = '';
    fetchJobs();
}

/* ── Grid rendering ──────────────────────────────────────────────── */
function renderGrid(jobs) {
    const grid = document.getElementById('job-grid');
    document.getElementById('grid-header-text').textContent =
        `Showing ${jobs.length} job${jobs.length === 1 ? '' : 's'}`;

    if (jobs.length === 0) {
        grid.innerHTML = buildEmptyState();
        return;
    }
    grid.innerHTML = jobs.map(buildCardHTML).join('');
}

function buildEmptyState() {
    const messages = {
        '':         'No jobs in the database. Run the pipeline to scrape some.',
        'new':      'No new jobs. Run the pipeline to scrape more.',
        'approved': 'No approved jobs. Approve some from the New tab.',
        'pending_questions': 'No jobs waiting on answers. Nice.',
        'applied':  'No applications yet. Apply to approved jobs using Apply All.',
        'skipped':  'No skipped jobs. Restore skipped jobs using Restore Skipped.',
        'manual':   'No manual jobs found.',
        'closed':   'No expired jobs. Run Validate to detect them.',
    };
    const message = state.search
        ? `No jobs match "${esc(state.search)}". Try a different keyword.`
        : (messages[state.status] || 'No jobs found.');

    return `
    <div class="empty-state">
        <div class="empty-icon">📭</div>
        <div class="empty-title">No jobs found</div>
        <div class="empty-message">${message}</div>
    </div>`;
}

function buildTypeBadge(job) {
    if (job.is_easy_apply && job.status !== 'manual') {
        return '<span class="badge badge--easy">Easy Apply</span>';
    }
    if (job.status === 'manual' || !job.is_easy_apply) {
        return '<span class="badge badge--manual">Manual</span>';
    }
    return '';
}

function buildCardHTML(job) {
    const sc = scoreBadgeColor(job.fit_score || 0);
    const scoreLabel = job.fit_score != null ? `${job.fit_score}/10` : '—';
    const expiryIcon = job.is_likely_expired
        ? `<span class="expiry-icon" title="Scraped ${timeAgo(job.created_at)} — may be expired. Click Validate to check.">⚠</span>`
        : '';
    const agingIcon = job.is_aging
        ? `<span class="aging-icon" title="Will be auto-purged in ≤2 days">⌛</span>`
        : '';
    const closedClass = job.status === 'closed' ? ' job-card--closed' : '';
    const manualClass = job.status === 'manual' ? ' job-card--manual' : '';

    return `
    <div class="job-card${closedClass}${manualClass}" id="job-card-${job.id}" onclick="openDetail(${job.id})">
        <div class="card-header">
            <span class="score-badge" style="background:${sc.bg};color:${sc.color}">${scoreLabel}</span>
            <div class="card-title-block">
                <div class="card-title">${esc(job.title)}</div>
                <div class="card-company">${esc(job.company)} · ${esc(job.location || '')}</div>
            </div>
            ${expiryIcon}${agingIcon}
        </div>
        <div class="card-badges">${buildTypeBadge(job)}</div>
        <div class="fit-reason">${esc(job.fit_reason || '')}</div>
        <div class="card-meta-time">Scraped ${timeAgo(job.created_at)}</div>
        <div class="card-divider"></div>
        <div class="card-actions" id="card-actions-${job.id}">${buildActionsHTML(job)}</div>
    </div>`;
}

function buildActionsHTML(job) {
    const viewBtn = `<button class="btn btn-view" data-url="${esc(job.url)}" onclick="viewJob(event)">↗ View</button>`;

    switch (job.status) {
        case 'new':
            return `
                <button class="btn btn-approve" onclick="approveJob(event, ${job.id})">Approve ✓</button>
                <button class="btn btn-skip" onclick="skipJob(event, ${job.id})">Skip ✗</button>
                <button class="btn btn-validate" onclick="validateJobCard(event, ${job.id})">Validate</button>
                ${viewBtn}`;

        case 'approved': {
            const ready = job.resume_path && job.resume_path !== 'failed' && job.resume_path !== '';
            if (ready) {
                return `<button class="btn btn-download" onclick="downloadResume(event, ${job.id})">⬇ Download Resume</button>${viewBtn}`;
            }
            if (job.resume_path === 'failed') {
                return `<span class="status-text status-text--danger">Tailoring failed — check logs</span>${viewBtn}`;
            }
            return `<button class="btn btn-tailoring" disabled><span class="spin-icon">⟳</span> Tailoring...</button>${viewBtn}`;
        }

        case 'pending_questions':
            return `
                <button class="btn btn-info" onclick="event.stopPropagation(); openAnswerPanel(${job.id})">✏ Answer Questions</button>
                ${viewBtn}`;

        case 'applied':
            return `<span class="status-text status-text--success">✓ Applied ${timeAgo(job.applied_at)}</span>${viewBtn}`;

        case 'skipped':
            return `<button class="btn btn-restore" onclick="restoreJob(event, ${job.id})">↩ Restore</button>${viewBtn}`;

        case 'manual':
            return `
                <button class="btn btn-manual" data-url="${esc(job.url)}" onclick="viewJob(event)">Apply Manually ↗</button>
                ${viewBtn}`;

        case 'closed':
            return `<span class="status-text status-text--muted">Closed</span>${viewBtn}`;

        default:
            return viewBtn;
    }
}

function viewJob(e) {
    e.stopPropagation();
    const url = e.currentTarget.dataset.url;
    if (url) window.open(url, '_blank');
}

/* ── In-place job update (used by approve / validate / poller) ─────── */
function applyJobUpdate(job) {
    const idx = allJobs.findIndex(j => j.id === job.id);
    if (idx >= 0) allJobs[idx] = job; else allJobs.push(job);

    const cardEl = document.getElementById(`job-card-${job.id}`);
    if (cardEl) cardEl.outerHTML = buildCardHTML(job);

    if (state.selectedJobId === job.id) renderDetailPanel(job);

    updateApplyAllCount();
}

/* ── Approve → tailoring poll ────────────────────────────────────── */
async function approveJob(e, id) {
    e.stopPropagation();
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin-icon">⟳</span> Approving...';
    try {
        const job = await api(`/api/jobs/${id}/approve`, { method: 'POST' });
        applyJobUpdate(job);
        showToast('Approved — tailoring in background', 'success');
        fetchStats();
        startPollingResume(id);
    } catch (err) {
        showToast('Approve failed: ' + err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = 'Approve ✓';
    }
}

function startPollingResume(id) {
    if (pollingResumeJobs.has(id)) return;
    pollingResumeJobs.add(id);
    pollResume(id, 0);
}

function pollResume(id, elapsed) {
    if (elapsed >= 90) {
        pollingResumeJobs.delete(id);
        const idx = allJobs.findIndex(j => j.id === id);
        if (idx >= 0) {
            allJobs[idx] = { ...allJobs[idx], resume_path: 'failed' };
            applyJobUpdate(allJobs[idx]);
        }
        return;
    }
    setTimeout(async () => {
        try {
            const job = await api(`/api/jobs/${id}`);
            const ready = job.resume_path && job.resume_path !== 'failed' && job.resume_path !== '' && job.status === 'approved';
            if (ready) {
                pollingResumeJobs.delete(id);
                applyJobUpdate(job);
                showToast('Resume ready — click Download!', 'success');
                return;
            }
            if (job.resume_path === 'failed') {
                pollingResumeJobs.delete(id);
                applyJobUpdate(job);
                showToast('Tailoring failed — check logs', 'error');
                return;
            }
        } catch (e) { /* transient — keep polling */ }
        pollResume(id, elapsed + 3);
    }, 3000);
}

function startTailoringPollers() {
    allJobs.forEach(job => {
        if (job.status === 'approved' &&
            (!job.resume_path || job.resume_path === '' || job.resume_path === 'failed')) {
            startPollingResume(job.id);
        }
    });
}

function downloadResume(e, id) {
    e.stopPropagation();
    window.open(`/api/jobs/${id}/resume`, '_blank');
}

/* ── Skip / restore ──────────────────────────────────────────────── */
async function skipJob(e, id) {
    e.stopPropagation();
    const btn = e.currentTarget;
    btn.disabled = true;
    try {
        await api(`/api/jobs/${id}/skip`, { method: 'POST' });
        showToast('Job skipped', 'success');
        if (state.selectedJobId === id) closeDetail();
        fetchJobs();
        fetchStats();
    } catch (err) {
        showToast('Skip failed: ' + err.message, 'error');
        btn.disabled = false;
    }
}

async function restoreJob(e, id) {
    e.stopPropagation();
    const btn = e.currentTarget;
    btn.disabled = true;
    try {
        await api(`/api/jobs/${id}/unskip`, { method: 'POST' });
        showToast('Job restored to New', 'success');
        if (state.selectedJobId === id) closeDetail();
        fetchJobs();
        fetchStats();
    } catch (err) {
        showToast('Restore failed: ' + err.message, 'error');
        btn.disabled = false;
    }
}

/* ── Per-card validate ───────────────────────────────────────────── */
async function validateJobCard(e, id) {
    e.stopPropagation();
    if (validatingJobs.has(id)) return;
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin-icon">⟳</span> Validating...';
    validatingJobs.add(id);
    try {
        await api(`/api/jobs/${id}/validate`, { method: 'POST' });
    } catch (err) {
        showToast('Validate failed: ' + err.message, 'error');
        validatingJobs.delete(id);
        btn.disabled = false;
        btn.innerHTML = 'Validate';
        return;
    }
    pollValidateJob(id, 0);
}

function pollValidateJob(id, elapsed) {
    if (elapsed >= 30) {
        validatingJobs.delete(id);
        const job = allJobs.find(j => j.id === id);
        if (job) applyJobUpdate(job);
        showToast('Validation is taking longer than expected', 'info');
        return;
    }
    setTimeout(async () => {
        try {
            const job = await api(`/api/jobs/${id}`);
            if (job.validated_at) {
                validatingJobs.delete(id);
                applyJobUpdate(job);
                showToast('Validation complete', 'success');
                fetchStats();
                return;
            }
        } catch (e) { /* transient — keep polling */ }
        pollValidateJob(id, elapsed + 3);
    }, 3000);
}

/* ── Top bar: Run Pipeline ───────────────────────────────────────── */
async function runPipelineClick() {
    const btn = document.getElementById('btn-run-pipeline');
    try {
        const r = await api('/api/pipeline/run', { method: 'POST' });
        if (r.status === 'already_running') {
            showToast('Pipeline already running', 'error');
            return;
        }
        btn.disabled = true;
        btn.innerHTML = '<span class="spin-icon">⟳</span> Running...';
        pollPipelineStatus(0);
    } catch (err) {
        showToast('Failed to start pipeline: ' + err.message, 'error');
    }
}

function pollPipelineStatus(elapsed) {
    if (elapsed >= 120) {
        finishPipelinePoll(null);
        return;
    }
    setTimeout(async () => {
        try {
            const s = await api('/api/pipeline/status');
            if (!s.running) {
                finishPipelinePoll(s);
                return;
            }
        } catch (e) { /* transient — keep polling */ }
        pollPipelineStatus(elapsed + 5);
    }, 5000);
}

function finishPipelinePoll(s) {
    const btn = document.getElementById('btn-run-pipeline');
    btn.disabled = false;
    btn.innerHTML = '▷ Run Pipeline';
    if (s && s.last_run) {
        showToast(`Pipeline done — ${s.last_run_new_jobs} new, ${s.last_run_scored} scored`, 'success');
    } else {
        showToast('Pipeline run finished', 'success');
    }
    fetchJobs();
    fetchStats();
}

/* ── Top bar: Apply All ──────────────────────────────────────────── */
function updateApplyAllCount() {
    const n = allJobs.filter(j =>
        j.status === 'approved' &&
        j.resume_path &&
        j.resume_path !== 'failed' &&
        j.resume_path !== ''
    ).length;
    const btn = document.getElementById('btn-apply-all');
    btn.textContent = `✓ Apply All (${n})`;
    btn.disabled = n === 0;
    btn.title = n === 0 ? 'No approved jobs with resumes ready' : '';
    return n;
}

async function applyAllClick() {
    const n = updateApplyAllCount();
    if (n === 0) return;
    if (!confirm(`Apply to ${n} jobs? This will open a browser and submit applications automatically. Ensure you're ready to proceed.`)) return;
    try {
        await api('/api/apply-all', { method: 'POST' });
        showToast('Applying... check the browser window', 'info');
        setTimeout(() => { fetchJobs(); fetchStats(); }, 8000);
    } catch (err) {
        showToast('Apply All failed: ' + err.message, 'error');
    }
}

/* ── Maintenance ─────────────────────────────────────────────────── */
async function triggerValidation() {
    const btn = document.getElementById('btn-validate');
    try {
        await api('/api/validate', { method: 'POST' });
        btn.disabled = true;
        btn.textContent = 'Validating... ⟳';
        pollValidateStatus(0);
    } catch (err) {
        showToast('Failed to start validation: ' + err.message, 'error');
    }
}

function pollValidateStatus(elapsed) {
    if (elapsed >= 60) {
        finishValidatePoll();
        return;
    }
    setTimeout(async () => {
        try { await api('/api/validate/status'); } catch (e) { /* ignore */ }
        pollValidateStatus(elapsed + 5);
    }, 5000);
}

function finishValidatePoll() {
    const btn = document.getElementById('btn-validate');
    btn.disabled = false;
    btn.textContent = 'Validate Jobs';
    showToast('Validation complete — check job cards for updates', 'success');
    fetchJobs();
    fetchStats();
}

async function triggerPurge() {
    const purgeCount = Number(document.getElementById('purge-count').textContent) || 0;
    if (!confirm(`This permanently deletes all Closed/Failed jobs and their resume files. ${purgeCount} jobs will be removed. Cannot be undone.`)) return;
    try {
        const data = await api('/api/jobs/purge', { method: 'POST' });
        showToast(`Purged ${data.jobs_deleted} jobs, cleaned ${data.files_cleaned} files`, 'success');
        fetchJobs();
        fetchStats();
    } catch (err) {
        showToast('Purge failed: ' + err.message, 'error');
    }
}

async function triggerPurgeOld() {
    const purgeOldCount = Number(document.getElementById('purge-old-count').textContent) || 0;
    const maxAge = document.getElementById('btn-purge-old').dataset.maxAge;
    if (!confirm(`Delete ${purgeOldCount} jobs older than ${maxAge} days? This cannot be undone.`)) return;
    try {
        const data = await api('/api/jobs/purge-old', { method: 'POST' });
        showToast(`Purged ${data.jobs_purged} jobs and cleaned ${data.files_deleted} files`, 'success');
        fetchJobs();
        fetchStats();
    } catch (err) {
        showToast('Purge failed: ' + err.message, 'error');
    }
}

async function triggerRestoreAll() {
    try {
        const data = await api('/api/jobs/unskip-all', { method: 'POST' });
        showToast(`Restored ${data.restored} skipped jobs`, 'success');
        fetchJobs();
        fetchStats();
    } catch (err) {
        showToast('Restore failed: ' + err.message, 'error');
    }
}

/* ── Detail panel ────────────────────────────────────────────────── */
function renderDetailPanel(job) {
    const sc = scoreBadgeColor(job.fit_score || 0);
    const scoreLabel = job.fit_score != null ? `${job.fit_score}/10` : '—';
    const expiredBadge = job.is_likely_expired
        ? `<span class="badge badge--expired">⚠ May be expired</span>`
        : '';

    document.getElementById('detail-body').innerHTML = `
        <div class="detail-header-row">
            <span class="score-badge" style="background:${sc.bg};color:${sc.color}">${scoreLabel}</span>
            <div class="detail-title-block">
                <div class="detail-title">${esc(job.title)}</div>
                <div class="detail-sub">${esc(job.company)} · ${esc(job.location || '')} · scraped ${timeAgo(job.created_at)}</div>
                <div class="detail-badges">${buildTypeBadge(job)}${expiredBadge}</div>
            </div>
        </div>

        <div class="section-label">Fit Reason</div>
        <div class="detail-text">${esc(job.fit_reason || '—')}</div>

        <div class="section-label">Job Description</div>
        <div class="detail-text">${esc(job.description || '—')}</div>

        <div class="section-label">Actions</div>
        <div class="card-actions" id="detail-actions">${buildActionsHTML(job)}</div>
    `;
}

function openDetail(jobId) {
    if (state.selectedJobId === jobId) return;
    const job = allJobs.find(j => j.id === jobId);
    if (!job) return;

    state.selectedJobId = jobId;
    renderDetailPanel(job);
    document.getElementById('detail-panel').classList.add('open');
    document.getElementById('detail-backdrop').classList.add('open');
}

function closeDetail() {
    state.selectedJobId = null;
    document.getElementById('detail-panel').classList.remove('open');
    document.getElementById('detail-backdrop').classList.remove('open');
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDetail();
});
document.getElementById('detail-backdrop').addEventListener('click', closeDetail);

/* ── Answer panel (pending questions) ────────────────────────────── */
async function openAnswerPanel(jobId) {
    try {
        const [job, questions] = await Promise.all([
            api(`/api/jobs/${jobId}`),
            api(`/api/jobs/${jobId}/questions`),
        ]);
        renderAnswerPanel(job, questions);
        document.getElementById('detail-panel').classList.add('open');
        document.getElementById('detail-backdrop').classList.add('open');
        state.selectedJobId = jobId;
    } catch (e) {
        showToast('Failed to load questions: ' + e.message, 'error', 5000);
    }
}

function renderAnswerPanel(job, questions) {
    const panel = document.getElementById('detail-body');

    let questionsHTML = questions.map(q => {
        const inputId = `pq-${q.id}`;
        const checkId = `bank-${q.id}`;
        const suggested = q.ai_suggested_answer || '';
        const confPct = q.ai_confidence != null
            ? Math.round(q.ai_confidence * 100) + '%'
            : null;
        const suggestedLabel = confPct
            ? `<span class="ai-suggestion-label">AI suggested (${confPct} confidence) — verify before saving</span>`
            : '';

        let inputHTML;
        if (q.options && q.options.length > 0) {
            const opts = q.options.map(opt =>
                `<option value="${esc(opt)}" ${opt === suggested ? 'selected' : ''}>${esc(opt)}</option>`
            ).join('');
            inputHTML = `<select class="form-input" id="${inputId}" data-pending-id="${q.id}">${opts}</select>`;
        } else if (q.field_type === 'number') {
            inputHTML = `<input class="form-input" type="number" id="${inputId}"
                               data-pending-id="${q.id}" value="${esc(suggested)}">`;
        } else {
            inputHTML = `<input class="form-input" type="text" id="${inputId}"
                               data-pending-id="${q.id}" value="${esc(suggested)}">`;
        }

        return `
            <div class="pending-question" style="margin-bottom:16px;">
                <div class="form-label" style="margin-bottom:6px;">${esc(q.question_raw)}</div>
                ${suggestedLabel}
                ${inputHTML}
                <label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--text-muted);">
                    <input type="checkbox" id="${checkId}" data-pending-id="${q.id}"
                           class="bank-save-checkbox" checked>
                    Remember this answer for future applications
                </label>
            </div>
        `;
    }).join('');

    if (questions.length === 0) {
        questionsHTML = `<div class="detail-text" style="color:var(--text-muted);">No unanswered questions found for this job.</div>`;
    }

    panel.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <div>
                <div style="font-size:16px;font-weight:600;">${esc(job.title)}</div>
                <div style="font-size:13px;color:var(--text-muted);">${esc(job.company)}</div>
            </div>
        </div>
        <div style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;
                    color:var(--text-muted);margin-bottom:12px;">
            UNANSWERED QUESTIONS (${questions.length})
        </div>
        ${questionsHTML}
        ${questions.length > 0 ? `
        <div style="margin-top:20px;">
            <button class="btn-primary" onclick="submitAnswers(${job.id})">
                Save &amp; Continue
            </button>
        </div>` : ''}
    `;
}

async function submitAnswers(jobId) {
    const resolutions = [];
    document.querySelectorAll('[data-pending-id]').forEach(input => {
        if (input.tagName === 'INPUT' && input.type === 'checkbox') return;
        const pendingId = parseInt(input.getAttribute('data-pending-id'));
        const answer = input.value.trim();
        const saveCheckbox = document.querySelector(
            `.bank-save-checkbox[data-pending-id="${pendingId}"]`
        );
        const saveToBank = saveCheckbox ? saveCheckbox.checked : true;
        resolutions.push({ pending_id: pendingId, answer, save_to_bank: saveToBank });
    });

    const unanswered = resolutions.filter(r => !r.answer);
    if (unanswered.length > 0) {
        showToast(`Please answer all ${unanswered.length} question(s)`, 'error', 4000);
        return;
    }

    try {
        await api(`/api/jobs/${jobId}/answers`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ resolutions }),
        });
        showToast('Answers saved — job is back in the Apply queue', 'success');
        closeDetail();
        fetchJobs();
        fetchStats();
    } catch (e) {
        showToast('Failed to save answers: ' + e.message, 'error', 5000);
    }
}

/* ── QA bank modal (Manage Saved Answers) ────────────────────────── */
let qaBankCache = [];

async function openQABankModal() {
    document.getElementById('qabank-backdrop').classList.add('open');
    document.getElementById('qabank-modal-body').innerHTML = 'Loading…';
    try {
        qaBankCache = await api('/api/qa-bank');
        renderQABankTable();
    } catch (e) {
        document.getElementById('qabank-modal-body').innerHTML =
            `<div class="detail-text">Failed to load: ${esc(e.message)}</div>`;
    }
}

function closeQABankModal() {
    document.getElementById('qabank-backdrop').classList.remove('open');
}

function renderQABankTable() {
    const body = document.getElementById('qabank-modal-body');
    if (qaBankCache.length === 0) {
        body.innerHTML = `<div class="detail-text" style="color:var(--text-muted);">No saved answers yet — they accumulate as you apply.</div>`;
        return;
    }

    const rows = qaBankCache.map(e => {
        const q = e.question_raw.length > 60 ? e.question_raw.slice(0, 60) + '…' : e.question_raw;
        return `
        <tr data-qa-id="${e.id}">
            <td title="${esc(e.question_raw)}">${esc(q)}</td>
            <td><span class="badge" style="text-transform:none;background:var(--border);color:var(--text-muted);">${esc(e.field_type)}</span></td>
            <td class="qabank-answer-cell" ondblclick="editQABankAnswer(${e.id})" id="qabank-answer-${e.id}">${esc(e.answer)}</td>
            <td><span class="qabank-source-badge qabank-source-badge--${esc(e.source)}">${esc(e.source)}</span></td>
            <td>${e.use_count}</td>
            <td><button class="qabank-delete-btn" onclick="deleteQABankAnswer(${e.id})" title="Delete">🗑</button></td>
        </tr>`;
    }).join('');

    body.innerHTML = `
        <table class="qabank-table">
            <thead>
                <tr>
                    <th>Question</th><th>Type</th><th>Answer (double-click to edit)</th>
                    <th>Source</th><th>Uses</th><th></th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>
    `;
}

function editQABankAnswer(qaId) {
    const cell = document.getElementById(`qabank-answer-${qaId}`);
    const entry = qaBankCache.find(e => e.id === qaId);
    if (!cell || !entry) return;
    const original = entry.answer;

    cell.innerHTML = `<input type="text" value="${esc(original)}">`;
    const input = cell.querySelector('input');
    input.focus();
    input.select();

    const commit = async () => {
        const newValue = input.value.trim();
        if (!newValue || newValue === original) {
            cell.textContent = original;
            return;
        }
        try {
            await api(`/api/qa-bank/${qaId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answer: newValue }),
            });
            entry.answer = newValue;
            cell.textContent = newValue;
            showToast('Answer updated', 'success');
        } catch (e) {
            cell.textContent = original;
            showToast('Update failed: ' + e.message, 'error');
        }
    };

    input.addEventListener('blur', commit);
    input.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') input.blur();
        if (ev.key === 'Escape') { cell.textContent = original; }
    });
}

async function deleteQABankAnswer(qaId) {
    if (!confirm('Delete this saved answer? It will fall through to AI again next time.')) return;
    try {
        await api(`/api/qa-bank/${qaId}`, { method: 'DELETE' });
        qaBankCache = qaBankCache.filter(e => e.id !== qaId);
        renderQABankTable();
        showToast('Answer deleted', 'success');
    } catch (e) {
        showToast('Delete failed: ' + e.message, 'error');
    }
}

/* ── Boot ────────────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', async () => {
    await fetchStats();
    await fetchJobs();
    startTailoringPollers();
});
</script>
